services:
  chroma:
    build:
      context: ./docker/chroma
    image: ticketing-ai-demo-chroma:local
    ports:
      - "${CHROMA_PORT:-8002}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

volumes:
  chroma_data:
