# Vector (Chroma) + graph (Neo4j) stores — data lives under ./data/ so it survives container removal.
# Start: docker compose up -d
services:
  chroma:
    build:
      context: ./docker/chroma
    image: ticketing-ai-demo-chroma:local
    ports:
      - "${CHROMA_PORT:-8002}:8000"
    volumes:
      - ./data/chroma:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-changeme}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
      - ./data/neo4j/import:/import
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s
    restart: unless-stopped

  # One-shot worker image for script plugins (docker run per invoke — not a long-running service).
  plugin-worker:
    build:
      context: .
      dockerfile: docker/plugin-worker/Dockerfile
    image: ticketing-ai-demo-plugin-worker:local
    profiles:
      - plugins

  sandbox-toolkit:
    build:
      context: ./docker/sandbox-toolkit
      dockerfile: Dockerfile
    image: ticketing-ai-demo-sandbox-toolkit:local
    profiles:
      - sandbox
